<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الفصول — SON OF THE VOID</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Cinzel:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="../assets/favicon/favicon.svg"
    >

    <style>
        :root {
            --bg: #070707;
            --card: #0d0d0d;
            --border: #271313;
            --border-hover: #571919;
            --red: #a51d1d;
            --red-light: #c12929;
            --text: #f1eeee;
            --muted: #918888;
            --dim: #625959;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        html::-webkit-scrollbar {
            display: none;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -15%,
                    rgba(165, 29, 29, 0.10),
                    transparent 42%
                ),
                var(--bg);

            color: var(--text);
            font-family: "Cairo", sans-serif;

            scrollbar-width: none;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 34px;

            background: rgba(7, 7, 7, 0.86);
            border-bottom: 1px solid rgba(165, 29, 29, 0.16);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #4d1515;

            background:
                linear-gradient(
                    145deg,
                    #180909,
                    #090909
                );

            color: var(--red-light);

            font-family: "Cinzel", serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;

            box-shadow:
                0 0 20px rgba(165, 29, 29, 0.08);
        }

        .brand-name {
            font-family: "Cinzel", serif;
            font-size: 13px;
            letter-spacing: 2px;
            color: #d7d0d0;
        }

        .home-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 10px 15px;

            border: 1px solid var(--border);

            color: #aaa1a1;

            font-size: 13px;

            transition:
                color 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease;
        }

        .home-button:hover {
            color: #ffffff;
            background: rgba(165, 29, 29, 0.06);
            border-color: var(--border-hover);
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            width: min(1080px, calc(100% - 40px));
            margin: 0 auto;

            padding: 88px 0 100px;
        }

        .page-header {
            margin-bottom: 46px;
        }

        .eyebrow {
            margin-bottom: 12px;

            color: var(--red-light);

            font-family: "Cinzel", serif;
            font-size: 12px;
            letter-spacing: 4px;
        }

        .page-title {
            font-size: clamp(38px, 6vw, 68px);
            font-weight: 700;
            line-height: 1.1;
        }

        .page-description {
            margin-top: 17px;
            max-width: 600px;

            color: var(--muted);

            font-size: 15px;
            line-height: 2;
        }

        /* =========================
           VOLUME CARD
        ========================= */

        .volume-list {
            display: flex;
            flex-direction: column;
        }

        .volume-item {
            overflow: hidden;

            border: 1px solid var(--border);

            background:
                linear-gradient(
                    120deg,
                    rgba(255,255,255,0.015),
                    rgba(255,255,255,0)
                ),
                var(--card);

            transition:
                border-color 0.3s ease;
        }

        .volume-item:hover {
            border-color: rgba(165, 29, 29, 0.35);
        }

        .volume-item.open {
            border-color: rgba(165, 29, 29, 0.45);
        }

        .volume-header {
            width: 100%;

            display: grid;
            grid-template-columns: 80px 1fr 48px;
            align-items: center;

            gap: 18px;

            padding: 28px;

            border: none;
            background: transparent;

            color: inherit;
            text-align: right;

            cursor: pointer;
        }

        .volume-number {
            color: var(--red);

            font-family: "Cinzel", serif;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .volume-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .volume-name {
            color: #eee7e7;

            font-family: "Cinzel", serif;
            font-size: clamp(18px, 3vw, 27px);
            letter-spacing: 2px;

            direction: ltr;
            text-align: right;
        }

        .volume-meta {
            color: #736a6a;
            font-size: 13px;
        }

        .volume-arrow {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #311717;

            color: #9a8787;

            font-family: Arial, sans-serif;
            font-size: 20px;

            transition:
                transform 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                background 0.3s ease;
        }

        .volume-item.open .volume-arrow {
            transform: rotate(45deg);

            color: white;
            border-color: #651b1b;
            background: rgba(165, 29, 29, 0.10);
        }

        /* =========================
           CHAPTER LIST
        ========================= */

        .volume-chapters {
            display: grid;
            grid-template-rows: 0fr;

            transition:
                grid-template-rows 0.4s ease;
        }

        .volume-item.open .volume-chapters {
            grid-template-rows: 1fr;
        }

        .volume-chapters-inner {
            min-height: 0;
            overflow: hidden;

            border-top: 1px solid transparent;

            transition:
                border-color 0.3s ease,
                padding 0.4s ease;
        }

        .volume-item.open .volume-chapters-inner {
            padding: 12px;
            border-top-color: #211111;
        }

        .chapter {
            min-height: 88px;

            display: grid;
            grid-template-columns: 70px 1fr 44px;
            align-items: center;

            gap: 18px;

            padding: 18px 20px;

            border: 1px solid transparent;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                transform 0.25s ease;
        }

        .chapter:hover {
            background: rgba(165, 29, 29, 0.05);
            border-color: #341515;
            transform: translateX(-3px);
        }

        .chapter-number {
            color: #716565;

            font-family: "Cinzel", serif;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .chapter-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .chapter-label {
            color: var(--red-light);
            font-size: 11px;
            letter-spacing: 1px;
        }

        .chapter-title {
            color: #ddd6d6;
            font-size: 15px;
            font-weight: 500;
        }

        .chapter-arrow {
            color: #756464;

            font-family: Arial, sans-serif;
            font-size: 19px;

            transition:
                color 0.25s ease,
                transform 0.25s ease;
        }

        .chapter:hover .chapter-arrow {
            color: var(--red-light);
            transform: translateX(-4px);
        }

        .chapter.disabled {
            opacity: 0.32;
            cursor: default;
        }

        .chapter.disabled:hover {
            background: transparent;
            border-color: transparent;
            transform: none;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 80px;

            padding-top: 26px;

            border-top: 1px solid #171111;

            display: flex;
            justify-content: space-between;
            align-items: center;

            color: var(--dim);

            font-size: 12px;
        }

        .footer-logo {
            font-family: "Cinzel", serif;
            letter-spacing: 2px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .topbar {
                padding: 15px 18px;
            }

            .brand-name {
                display: none;
            }

            .home-button {
                padding: 9px 13px;
                font-size: 12px;
            }

            .page {
                width: min(100% - 24px, 1080px);
                padding-top: 58px;
            }

            .page-header {
                margin-bottom: 34px;
            }

            .page-description {
                font-size: 14px;
            }

            .volume-header {
                grid-template-columns: 48px 1fr 40px;
                gap: 12px;
                padding: 21px 18px;
            }

            .volume-number {
                font-size: 14px;
            }

            .volume-name {
                font-size: 16px;
            }

            .volume-meta {
                font-size: 11px;
            }

            .volume-arrow {
                width: 34px;
                height: 34px;
            }

            .chapter {
                grid-template-columns: 42px 1fr 32px;
                gap: 10px;

                min-height: 78px;

                padding: 15px 12px;
            }

            .chapter-title {
                font-size: 13px;
            }

            .footer {
                margin-top: 60px;
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">

        <a href="../index.html" class="brand">
            <span class="brand-mark">SOV</span>
            <span class="brand-name">SON OF THE VOID</span>
        </a>

        <a href="../index.html" class="home-button">
            <span>←</span>
            <span>الرئيسية</span>
        </a>

    </header>


    <main class="page">

        <header class="page-header">

            <p class="eyebrow">
                THE CHRONICLES
            </p>

            <h1 class="page-title">
                الفصول
            </h1>

            <p class="page-description">
                اختر المجلد الذي تريد قراءته.
            </p>

        </header>


        <section class="volume-list">

            <div class="volume-item">

                <button
                    class="volume-header"
                    type="button"
                    aria-expanded="false"
                >

                    <span class="volume-number">
                        01
                    </span>

                    <span class="volume-info">

                        <span class="volume-name">
                            PATH OF THE VOID
                        </span>

                        <span class="volume-meta">
                            المجلد الأول
                        </span>

                    </span>

                    <span class="volume-arrow">
                        +
                    </span>

                </button>


                <div class="volume-chapters">

                    <div class="volume-chapters-inner">

                        <!-- الفصل الأول -->

                        <a
                            href="../PATH%20OF%20THE%20VOID/chapter-01.html"
                            class="chapter"
                        >

                            <span class="chapter-number">
                                01
                            </span>

                            <span class="chapter-info">

                                <span class="chapter-label">
                                    الفصل الأول
                                </span>

                                <span class="chapter-title">
                                    حين بدأت السماء بالصمت
                                </span>

                            </span>

                            <span class="chapter-arrow">
                                ←
                            </span>

                        </a>


                        <!-- الفصل الثاني -->

                        <div class="chapter disabled">

                            <span class="chapter-number">
                                02
                            </span>

                            <span class="chapter-info">

                                <span class="chapter-label">
                                    الفصل الثاني
                                </span>

                                <span class="chapter-title">
                                    قريبًا
                                </span>

                            </span>

                            <span class="chapter-arrow">
                                —
                            </span>

                        </div>


                        <!-- الفصل الثالث -->

                        <div class="chapter disabled">

                            <span class="chapter-number">
                                03
                            </span>

                            <span class="chapter-info">

                                <span class="chapter-label">
                                    الفصل الثالث
                                </span>

                                <span class="chapter-title">
                                    قريبًا
                                </span>

                            </span>

                            <span class="chapter-arrow">
                                —
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <footer class="footer">

            <span>
                SON OF THE VOID
            </span>

            <span class="footer-logo">
                SOV
            </span>

        </footer>

    </main>


    <script>

        const volumeHeaders =
            document.querySelectorAll(".volume-header");


        volumeHeaders.forEach(header => {

            header.addEventListener("click", () => {

                const volume =
                    header.closest(".volume-item");

                if (!volume) {
                    return;
                }

                const isOpen =
                    volume.classList.contains("open");


                document
                    .querySelectorAll(".volume-item")
                    .forEach(item => {

                        item.classList.remove("open");

                        const itemHeader =
                            item.querySelector(".volume-header");

                        if (itemHeader) {
                            itemHeader.setAttribute(
                                "aria-expanded",
                                "false"
                            );
                        }

                    });


                if (!isOpen) {

                    volume.classList.add("open");

                    header.setAttribute(
                        "aria-expanded",
                        "true"
                    );

                }

            });

        });

    </script>

</body>
</html>
