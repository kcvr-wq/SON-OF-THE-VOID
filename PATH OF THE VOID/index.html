<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>PATH OF THE VOID</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            background: #050505;

            color: #eeeeee;

            font-family: "Cairo", sans-serif;

            overflow-x: hidden;

        }


        a {
            color: inherit;
            text-decoration: none;
        }


        .path-page {

            width: min(100%, 1100px);

            margin: 0 auto;

            padding:
                55px 30px
                90px;

        }


        /* =========================
           TOP
        ========================= */

        .path-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 70px;

        }


        .back-link {

            display: inline-flex;

            align-items: center;

            gap: 9px;

            color: #777;

            font-size: 13px;

            transition:
                color 0.25s ease;

        }


        .back-link:hover {

            color: #eeeeee;

        }


        .path-mark {

            color: #444;

            font-family: "Cinzel", serif;

            font-size: 10px;

            letter-spacing: 3px;

        }


        /* =========================
           TITLE
        ========================= */

        .path-heading {

            margin-bottom: 48px;

        }


        .path-label {

            margin-bottom: 12px;

            color: #650000;

            font-family: "Cinzel", serif;

            font-size: 10px;

            letter-spacing: 5px;

        }


        .path-heading h1 {

            font-family: "Cinzel", serif;

            font-size:
                clamp(42px, 7vw, 78px);

            font-weight: 500;

            line-height: 0.95;

            letter-spacing: 3px;

        }


        .path-heading h1 span {

            color: #750000;

        }


        .path-line {

            width: 90px;

            height: 1px;

            margin-top: 26px;

            background:
                linear-gradient(
                    90deg,
                    #700000,
                    transparent
                );

        }


        /* =========================
           CHAPTER LIST
        ========================= */

        .chapter-list {

            display: flex;

            flex-direction: column;

            border-top:
                1px solid
                rgba(255,255,255,0.07);

        }


        .chapter {

            display: grid;

            grid-template-columns:
                75px
                1fr
                35px;

            align-items: center;

            gap: 20px;

            min-height: 105px;

            padding:
                18px 8px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.07);

            transition:
                background 0.25s ease,
                padding-right 0.25s ease;

        }


        .chapter:hover {

            background:
                rgba(255,255,255,0.02);

            padding-right: 16px;

        }


        .chapter-number {

            color: #650000;

            font-family: "Cinzel", serif;

            font-size: 13px;

            letter-spacing: 2px;

        }


        .chapter-details {

            min-width: 0;

        }


        .chapter-label {

            display: block;

            margin-bottom: 4px;

            color: #555;

            font-size: 10px;

        }


        .chapter-title {

            color: #c8c8c8;

            font-size: 16px;

            font-weight: 500;

        }


        .chapter-arrow {

            color: #650000;

            font-size: 18px;

            text-align: center;

        }


        .chapter.disabled {

            opacity: 0.35;

            cursor: default;

        }


        .chapter.disabled:hover {

            background: transparent;

            padding-right: 8px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .path-page {

                padding:
                    35px 20px
                    70px;

            }


            .path-top {

                margin-bottom: 55px;

            }


            .path-mark {

                display: none;

            }


            .path-heading {

                margin-bottom: 35px;

            }


            .path-heading h1 {

                font-size: 38px;

            }


            .chapter {

                grid-template-columns:
                    45px
                    1fr
                    25px;

                gap: 12px;

                min-height: 90px;

                padding:
                    15px 4px;

            }


            .chapter-title {

                font-size: 14px;

            }

        }


        @media (max-width: 420px) {

            .path-heading h1 {

                font-size: 32px;

            }


            .chapter-title {

                font-size: 13px;

            }

        }

    </style>

</head>


<body>


    <main class="path-page">


        <!-- =========================
             TOP
        ========================== -->

        <div class="path-top">

            <a
                href="../index.html"
                class="back-link"
            >
                ← العودة إلى الفصول
            </a>


            <span class="path-mark">
                SON OF THE VOID
            </span>

        </div>



        <!-- =========================
             TITLE
        ========================== -->

        <header class="path-heading">

            <p class="path-label">
                THE CHRONICLES
            </p>


            <h1>
                PATH OF THE
                <span>VOID</span>
            </h1>


            <div class="path-line"></div>

        </header>



        <!-- =========================
             CHAPTERS
        ========================== -->

        <section class="chapter-list">


            <!-- CHAPTER 01 -->

            <a
                href="chapter-01.html"
                class="chapter"
            >

                <span class="chapter-number">
                    01
                </span>


                <div class="chapter-details">

                    <span class="chapter-label">
                        الفصل الأول
                    </span>

                    <span class="chapter-title">
                        حين بدأت السماء بالصمت
                    </span>

                </div>


                <span class="chapter-arrow">
                    ←
                </span>

            </a>



            <!-- CHAPTER 02 -->

            <div class="chapter disabled">

                <span class="chapter-number">
                    02
                </span>


                <div class="chapter-details">

                    <span class="chapter-label">
                        الفصل الثاني
                    </span>

                    <span class="chapter-title">
                        قريبًا
                    </span>

                </div>


                <span class="chapter-arrow">
                    —
                </span>

            </div>



            <!-- CHAPTER 03 -->

            <div class="chapter disabled">

                <span class="chapter-number">
                    03
                </span>


                <div class="chapter-details">

                    <span class="chapter-label">
                        الفصل الثالث
                    </span>

                    <span class="chapter-title">
                        قريبًا
                    </span>

                </div>


                <span class="chapter-arrow">
                    —
                </span>

            </div>


        </section>


    </main>


</body>

</html>
